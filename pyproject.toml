[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "plenticore-mcp"
version = "0.1.0"
description = "Local MCP server for KOSTAL PLENTICORE readings and settings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NemoN" }]
keywords = ["mcp", "kostal", "plenticore", "solar", "inverter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "mcp>=2.3,<3",
    "pykoplenti>=1.5.1,<2",
    "aiohttp>=3.9,<4",
    "pydantic>=2,<3",
    "yarl>=1.9,<2",
    "python-dotenv>=1.1,<2",
]

[project.urls]
Homepage = "https://github.com/NemoN/plenticore-mcp"
Repository = "https://github.com/NemoN/plenticore-mcp"
Issues = "https://github.com/NemoN/plenticore-mcp/issues"
Changelog = "https://github.com/NemoN/plenticore-mcp/blob/main/CHANGELOG.md"

[project.scripts]
plenticore-mcp = "plenticore_mcp.server:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/plenticore_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/docs", "/examples", "/.github",
    "/README.md", "/README.de.md", "/LICENSE", "/CONTRIBUTING.md", "/SECURITY.md",
    "/CHANGELOG.md", "/pyproject.toml", "/uv.lock", "/requirements.lock",
    "/Dockerfile", "/.dockerignore", "/.gitignore", "/.env.example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
